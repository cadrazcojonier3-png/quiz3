<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #202633;
            padding: 35px 18px;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .institucion {
            font-size: 14px;
            line-height: 1.45;
            font-weight: bold;
            color: #222;
            margin-bottom: 28px;
        }

        h1 {
            color: #102b59;
            font-size: clamp(34px, 6vw, 48px);
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #555b66;
            font-size: 17px;
        }

        main {
            max-width: 850px;
            margin: 0 auto;
        }

        .titulo-seccion {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 5px 26px;
        }

        .titulo-seccion h2 {
            color: #102b59;
            font-size: 29px;
            white-space: nowrap;
        }

        .linea {
            height: 2px;
            background: #1686c5;
            flex: 1;
        }

        #recetas {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .tarjeta {
            display: flex;
            align-items: stretch;
            gap: 18px;
            padding: 10px;
            border: 1px solid #d6d6d6;
            border-radius: 19px;
            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.08);
            background: white;
        }

        .tarjeta img {
            width: 38%;
            min-height: 180px;
            max-height: 220px;
            object-fit: cover;
            border-radius: 12px;
        }

        .informacion {
            flex: 1;
            min-width: 0;
        }

        .informacion h3 {
            color: #102b59;
            font-size: 25px;
            margin: 1px 0 12px;
        }

        .dato {
            background: #f0f1f3;
            border-radius: 8px;
            padding: 7px 10px;
            margin-bottom: 8px;
            font-size: 14px;
            line-height: 1.35;
        }

        .dato strong {
            color: #202633;
            margin-right: 5px;
        }

        #estado {
            text-align: center;
            color: #555;
            padding: 25px;
        }

        @media (max-width: 620px) {
            body {
                padding: 25px 12px;
            }

            .tarjeta {
                flex-direction: column;
                gap: 12px;
            }

            .tarjeta img {
                width: 100%;
                height: 210px;
                min-height: 0;
            }

            .informacion h3 {
                font-size: 22px;
            }

            .titulo-seccion h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="encabezado">
        <p class="institucion">
            Programación Web I<br>
            Ingeniería de Sistemas<br>
            Facultad de Ciencias básicas, Ingenierías y Arquitectura<br>
            Corporación Universitaria del Caribe
        </p>

        <h1>Recetario Web</h1>
        <p class="subtitulo">Descubre dos recetas deliciosas para preparar en casa.</p>
    </header>

    <main>
        <section class="titulo-seccion">
            <h2>Nuestras recetas</h2>
            <div class="linea"></div>
        </section>

        <section id="recetas">
            <p id="estado">Cargando recetas...</p>
        </section>
    </main>

    <script>
        const contenedor = document.getElementById("recetas");

        async function cargarRecetas() {
            try {
                const respuesta = await fetch("https://dummyjson.com/recipes?limit=2");

                if (!respuesta.ok) {
                    throw new Error("No se pudieron cargar las recetas.");
                }

                const datos = await respuesta.json();

                contenedor.innerHTML = "";

                datos.recipes.forEach(receta => {
                    const tarjeta = document.createElement("article");
                    tarjeta.className = "tarjeta";

                    const imagen = document.createElement("img");
                    imagen.src = receta.image;
                    imagen.alt = receta.name;

                    const informacion = document.createElement("div");
                    informacion.className = "informacion";

                    const titulo = document.createElement("h3");
                    titulo.textContent = receta.name;

                    const cocina = document.createElement("p");
                    cocina.className = "dato";
                    cocina.innerHTML = "<strong>Tipo de cocina:</strong> ";
                    cocina.append(document.createTextNode(receta.cuisine));

                    const dificultad = document.createElement("p");
                    dificultad.className = "dato";
                    dificultad.innerHTML = "<strong>Dificultad:</strong> ";
                    dificultad.append(document.createTextNode(receta.difficulty));

                    const preparacion = document.createElement("p");
                    preparacion.className = "dato";
                    preparacion.innerHTML = "<strong>Tiempo de preparación:</strong> ";
                    preparacion.append(document.createTextNode(receta.prepTimeMinutes + " minutos"));

                    const primerPaso = document.createElement("p");
                    primerPaso.className = "dato";
                    primerPaso.innerHTML = "<strong>Primer paso:</strong> ";
                    primerPaso.append(document.createTextNode(receta.instructions[0]));

                    informacion.append(titulo, cocina, dificultad, preparacion, primerPaso);
                    tarjeta.append(imagen, informacion);
                    contenedor.appendChild(tarjeta);
                });

            } catch (error) {
                contenedor.innerHTML = "<p id='estado'>Error al cargar las recetas. Verifica tu conexión o la dirección de la API.</p>";
                console.error(error);
            }
        }

        cargarRecetas();
    </script>
</body>
</html>
